<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>


    <!-- To Do List Manager -->
    <div class="container">
        <h2 class="display-3 mb-2"> To Do List Manager</h2>
        <div class="form-floating mb-3">
            <input type="text" class="form-control mb-3" id="inputTask">
            <button class="btn btn-primary" id="addNewTaskBtn">Add Task</button>
            <button class="btn btn-primary" id="clearTaskBtn">Clear Task</button>
        </div>
        <div id="toDos" style="background-color: aqua;"></div>
    </div>

    <hr style="color: green;">
    <hr style="color: green;">

    <!-- 2.Student Marks Calculator -->
    <div class="container">
        <h2 class="display-3 mb-2">Student Marks Calculator</h2>
        <div class="form-floating mb-3">
            <input type="number" class="form-control mb-3" id="inputMarks">
            <button class="btn btn-primary" id="addNewMarksBtn">Add Marks</button>
            <button class="btn btn-primary" id="calculateBtn">Calculate</button>
            <button class="btn btn-primary" id="resetBtn">Reset</button>
        </div>
        <div id="marksDisplay"></div>
    </div>
    <hr style="color: green;">
    <hr style="color: green;">



    <!-- Search in an Array -->
    <div class="container">
        <h2 class="display-3 mb-2">Search in an Array</h2>
        <div class="input-group mb-3">
            <input type="text" class="form-control"
                 id="searchInput"
                placeholder="Enter Car brand" >
            <button class="btn btn-primary" onclick="addSearchDisplay()">Search</button>
            <div id="resultOutput" class="result"></div>
        </div>
        
    </div>

    <hr style="color: green;">
    <hr style="color: green;">



    <!-- Filter Even and Odd Numbers -->
    <div class="container">
        <h2 class="display-3 mb-2">Filter Even and Odd Numbers</h2>
    </div>

<hr style="color: green;">
    <hr style="color: green;">



    <!-- Sort Names Alphabetically -->
    <div class="container">
        <h2 class="display-3 mb-2">Sort Names Alphabetically</h2>
        <div class="form-floating mb-3">
            <input type="number" class="form-control mb-3" id="sortInput">
            <button onclick="AddNames()" class="btn btn-primary" id="addNewMarksBtn">Add Names</button>
            <button onclick="sortNames()" class="btn btn-primary" id="calculateBtn">Sort</button>
            <button onclick="sortReset()" class="btn btn-primary" id="sortResetBtn">Reset</button>
        </div>
        <div id="sortResult" style="background-color: aquamarine;"></div>
    </div>


    <script src="./selfmade.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
