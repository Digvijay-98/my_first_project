<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4-Digit OTP Form</title>
</head>
<body>

    <div style="font-family: Arial, sans-serif; margin: 30px; max-width: 350px;">
        <h2>4-Digit OTP Verification</h2>
        
        <button id="generateBtn" onclick="generateOTP()">Generate OTP</button>
        <p>Your OTP is: <strong id="displayOtp" style="color: blue;">----</strong></p>

        <div style="margin-top: 15px;">
            <label for="otpInput">Enter 4-Digit OTP:</label><br>
            <input type="text" id="otpInput" maxlength="4" placeholder="Type here" style="padding: 8px; margin-top: 5px; width: 150px;">
        </div>

        <button onclick="validateOTP()" style="margin-top: 10px; padding: 8px 15px;">Verify OTP</button>
        <p id="message" style="font-weight: bold; margin-top: 15px;"></p>
    </div>

    <!-- Link the JavaScript file -->
    <script src="./script.js"></script>
</body>
</html>
