<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
</head>

<body>
  <h1 class="display-4 bg-primary text-white p-4 text-center">
    E-Commerce <i>(byUniverse)</i> </h1>
  <!-- Navbar Tab -->
  <nav class="navbar navbar-expand-lg bg-success">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Hanuman469</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">about Us</a>
          </li>

          <li class="nav-item">
            <a class="nav-link">contact Us</a>
          </li>
        </ul>
        <div class="d-flex" role="search">

          <button class="btn btn-outline-danger" type="submit">cart</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="container w-50 mt-4">
    <div class="form-floating mb-3">
      <input type="text" class="form-control" id="inputName">
      <label for="inputName">Product Name</label>
    </div>
    <div class="form-floating mb-3">
      <input type="email" class="form-control" id="inputCategory">
      <label for="inputCategory">category</label>
    </div>
    <div class="form-floating mb-3">
      <input type="number" class="form-control" id="inputPrice">
      <label for="inputPrice">Price</label>
    </div>
    <div class="form-floating mb-3">
      <input type="number" class="form-control" id="inputStock" placeholder="name@example.com">
      <label for="inputStock">stock</label>
    </div>
    <button class="btn btn-primary w-100" id="addNewBtn">Add New Products</button>
  </div>

  <div class="conatiner">
    <div class="row" id="productList"></div>
  </div>


  <!--  -->
  <script src="./script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
    crossorigin="anonymous"></script>
</body>

</html>
